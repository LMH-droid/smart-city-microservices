server:
  port: 8002

spring:
  application:
    name: report-service

  # ============ 1. 数据库配置 (核心新增部分) ============
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_city}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # 首次启动设为 update，会自动创建/更新表结构。
    show-sql: true      # 在控制台显示SQL语句，便于调试
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # ============ 2. 原Nacos配置 (需移除排除项以启用数据库) ============
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  # ============ 3. 关键修改：移除 auto-configuration 排除项 ============
  # 必须删除或注释掉以下整个 `autoconfigure.exclude` 配置块，
  # 否则Spring Boot不会自动配置DataSource和JPA，导致无法连接数据库。
  # autoconfigure:
  #   exclude:
  #     - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  #     - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  #     - org.springframework.cloud.client.serviceregistry.AutoServiceRegistrationAutoConfiguration

logging:
  level:
    com.zhao.report: DEBUG