server:
  port: 8000  # 注意：user-service应该是8000端口

spring:
  application:
    name: user-service

  # 数据库配置
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_city}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true

  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# JWT配置
jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
  expiration: 86400000  # 24小时，单位毫秒

# 安全配置
security:
  user:
    name: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.zhao.user: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/user-service.log
    max-size: 10MB
    max-history: 30