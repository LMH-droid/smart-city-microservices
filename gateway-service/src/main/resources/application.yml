server:
  port: 8081

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # 各服务地址通过环境变量注入，默认指向本地开发端口
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8000}
          predicates:
            - Path=/api/users/**
        - id: report-service
          uri: ${REPORT_SERVICE_URI:http://localhost:8002}
          predicates:
            - Path=/api/reports/**
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8003}
          predicates:
            - Path=/api/ai/**
        - id: data-service
          uri: ${DATA_SERVICE_URI:http://localhost:8004}
          predicates:
            - Path=/api/data/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
